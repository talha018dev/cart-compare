<header class="topbar">
  <button class="menu-button" type="button" aria-label="Open navigation" [attr.aria-expanded]="sidebarOpen()" (click)="sidebarOpen.set(true)">☰</button>
  <div class="topbar-inner">
    <a routerLink="/products" class="focus-ring brand" aria-label="CartCompare home">
      <span class="brand-mark">C</span><span class="brand-name">Cart<em>Compare</em></span>
    </a>
    <label class="search">
      <span class="sr-only">Search deals</span>
      <p-iconfield styleClass="block w-full"><p-inputicon styleClass="pi pi-search text-text-muted" />
        <input pInputText fluid type="search" placeholder="Search groceries, stores, and deals" [value]="searchQuery()" (input)="onSearch($event)" />
      </p-iconfield>
    </label>
    <div class="top-actions">
      <button class="location-button" type="button">📍 Dhaka⌄</button>
      <button class="icon-button" type="button" (click)="toggleTheme()" [attr.aria-label]="darkMode() ? 'Use light mode' : 'Use dark mode'" [title]="darkMode() ? 'Use light mode' : 'Use dark mode'">{{ darkMode() ? '☀' : '☾' }}</button>
      <button class="icon-button" type="button" (click)="toggleDirection()" [attr.aria-label]="rtl() ? 'Use left-to-right layout' : 'Use right-to-left layout'" title="Toggle layout direction">⇄</button>
      <a href="#comparison-list" class="icon-button basket-link" aria-label="Comparison list">🛒 <span class="count">{{ basket().length }}</span></a>
    </div>
  </div>
</header>
<div class="app-layout">
  <aside class="sidebar" [class.open]="sidebarOpen()" aria-label="Primary navigation">
    <div class="mobile-side-head"><strong>Browse</strong><button type="button" aria-label="Close navigation" (click)="sidebarOpen.set(false)">×</button></div>
    <p class="side-title">Browse</p>
    @for (item of navigation; track item.label) {
      <button type="button" class="nav-item" [class.active]="selectedCategory() === item.category" (click)="selectCategory(item.category)"><span aria-hidden="true">{{ item.icon }}</span><span>{{ item.label }}</span></button>
    }
    <div class="side-divider"></div><p class="side-title">For you</p>
    <button type="button" class="nav-item"><span>🏷️</span><span>Weekly offers</span></button>
    <button type="button" class="nav-item"><span>♡</span><span>Saved items</span></button>
    <button type="button" class="nav-item"><span>◷</span><span>Recent searches</span></button>
    <button type="button" class="nav-item"><span>◎</span><span>Account</span></button>
  </aside>
  <main class="page-content"><router-outlet /></main>
</div>
@if (sidebarOpen()) { <button type="button" class="sidebar-scrim" aria-label="Close navigation" (click)="sidebarOpen.set(false)"></button> }
